name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      # api_keys.dart is gitignored; CI uses the placeholder template.
      - name: Prepare local API keys
        run: cp lib/config/api_keys.dart.template lib/config/api_keys.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
