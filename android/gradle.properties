# Gradle JVM 内存配置（支持 geolocator 等原生插件编译）
org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.user.home=D:/Softwaredata/GradleCache
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
compileSdkVersion=36
targetSdkVersion=36
flutter.compileSdkVersion=36
flutter.targetSdkVersion=36
flutter.minSdkVersion=21
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# --split-per-abi 默认会把 versionCode 改写为 abiCode*1000+versionCode（arm64 -> 2011），
# 导致与 pubspec 的 +11 不一致，且与不带 split 的 universal 包（11）之间无法互相覆盖安装。
# 强制忽略 ABI 编码，使所有 APK 的 versionCode 始终等于 pubspec 的 build 号。
force-version-code-ignoring-abi=true
